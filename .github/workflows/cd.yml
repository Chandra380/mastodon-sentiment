# CD: runs on push to main (e.g. after merge). Extend with build/deploy steps.
name: CD

on:
  push:
    branches: [dev, main]

jobs:
  build-validate:
    name: Build & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

