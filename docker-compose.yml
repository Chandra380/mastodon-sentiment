# Mastodon Sentiment Analysis - Docker Compose
# Phase 1: Kafka + data volumes (we'll add Airflow, Spark, etc. as we build)

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: mastodon-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - mastodon-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: mastodon-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"    # internal/plaintext
      - "29092:29092"  # host access
    depends_on:
      - zookeeper
    networks:
      - mastodon-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
  # =============================================================================
  # Kafka UI (optional - helps visualize topics and messages during dev)
  # =============================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: mastodon-kafka-ui
    ports:
      - "8081:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - mastodon-net

  # =============================================================================
  # Future services (uncomment as we build them):
  # =============================================================================
  #
  # airflow:
  #   image: apache/airflow:2.7.3
  #   ...
  #
  # spark:
  #   image: bitnami/spark:3.5
  #   ...
  #

volumes:
  kafka_data:
    driver: local

networks:
  mastodon-net:
    driver: bridge
